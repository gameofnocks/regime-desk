name: Nansen on-chain flows

# Three times a day: Nansen's token screener for Robinhood Chain and Base, and flows by wallet type for the
# followed tokens, stored encrypted for the site. Does nothing until the repository has a NANSEN_API_KEY secret.
# Each run makes 15 requests.
on:
  schedule:
    - cron: "23 1,9,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nansen.yml"
      - "nansen_trigger.txt"

permissions:
  contents: write

concurrency:
  group: nansen
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        if: env.NANSEN_API_KEY != ''
      - uses: actions/setup-python@v6
        if: env.NANSEN_API_KEY != ''
        with:
          python-version: "3.12"
      - run: pip install cryptography
        if: env.NANSEN_API_KEY != ''
      - name: Fetch and encrypt
        if: env.NANSEN_API_KEY != ''
        run: python3 tools/flows_fetch.py --nansen tools/site_pub.pem nansen.bin || true
      - name: Commit
        if: env.NANSEN_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nansen.bin nansen_status.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Nansen update"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 7; done
