<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0a">
<title>Paper Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --panel:#121212; --line:rgba(255,255,255,.08); --text:#dddddd; --dim:#8f8f8f; --faint:#5c5c5c; --up:#5fbf8a; --down:#eb6f62; --white:#fff; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font-family:Inter, system-ui, -apple-system, "Segoe UI", sans-serif; font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  #lock { min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
  #lock form { width:100%; max-width:320px; display:grid; gap:12px; }
  #lock h1 { font-size:22px; font-weight:450; color:var(--white); margin:0 0 4px; }
  #lock input[type=password] { font:inherit; font-size:16px; color:var(--white); background:var(--panel); border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:11px 12px; outline:none; }
  #lock button { font:inherit; font-size:14px; font-weight:500; color:var(--bg); background:var(--white); border:0; border-radius:999px; padding:10px 16px; cursor:pointer; }
  #lock button[disabled] { opacity:.5; }
  #lock label { display:flex; gap:8px; align-items:center; color:var(--dim); font-size:12px; }
  #lock p { margin:0; color:var(--dim); font-size:12px; min-height:18px; }
  #lock p.err { color:var(--down); }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  header h1 { font-size:20px; font-weight:450; color:var(--white); margin:0; }
  header a, header span { color:var(--dim); font-size:12px; text-decoration:none; }
  header a:hover { color:var(--white); }
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .stat { background:var(--bg); padding:12px 14px; }
  .stat b { display:block; font-size:20px; font-weight:450; color:var(--white); font-variant-numeric:tabular-nums; }
  .stat small { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .up { color:var(--up) !important; } .down { color:var(--down) !important; }
  @media (max-width:640px) { .stats { grid-template-columns:repeat(2, 1fr); } }
  section { margin-top:22px; }
  section h2 { font-size:12px; font-weight:500; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:0 0 8px; }
  .note { color:var(--faint); font-size:12px; margin:6px 0 0; }
  #curve { width:100%; height:180px; display:block; background:var(--panel); border-radius:12px; }
  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:12px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.05em; position:sticky; top:0; background:var(--bg); }
  td.wrap { white-space:normal; min-width:220px; max-width:420px; }
  td.num, th.num { text-align:right; }
  tr:last-child td { border-bottom:0; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; background:#1c1c1c; color:var(--dim); }
  .tag.pass { background:rgba(95,191,138,.14); color:var(--up); }
  .empty { padding:14px; color:var(--faint); }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  .tabs button { font:inherit; font-size:12px; color:var(--dim); background:#161616; border:0; border-radius:999px; padding:4px 12px; cursor:pointer; }
  .tabs button.on { color:var(--bg); background:var(--white); }
  footer { margin-top:28px; color:var(--faint); font-size:11px; }
</style>
</head>
<body>
<div id="lock">
  <form id="lock-form" autocomplete="off">
    <h1>Paper Book</h1>
    <input id="pw" type="password" placeholder="Passphrase" aria-label="Passphrase" autocomplete="current-password" autofocus>
    <label><input id="keep" type="checkbox" checked> Stay unlocked on this device</label>
    <button id="go" type="submit">Open</button>
    <p id="msg" role="status"></p>
  </form>
</div>
<main id="app" hidden>
  <header>
    <h1>Paper Book</h1>
    <span id="built"></span>
    <a href="../">Back to the desk</a>
  </header>
  <div class="stats" id="stats"></div>
  <section>
    <h2>Equity</h2>
    <svg id="curve" viewBox="0 0 1000 180" preserveAspectRatio="none" role="img" aria-label="Equity over time"></svg>
    <p class="note" id="curve-note"></p>
  </section>
  <section>
    <h2>Open positions</h2>
    <div class="scroll"><table id="open"></table></div>
  </section>
  <section>
    <h2>Last scan</h2>
    <div class="tabs" id="scan-tabs"></div>
    <div class="scroll"><table id="scan"></table></div>
    <p class="note" id="scan-note"></p>
  </section>
  <section>
    <h2>Closed</h2>
    <div class="scroll"><table id="closed"></table></div>
  </section>
  <footer id="foot"></footer>
</main>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  // the desk's own keys, so a device that keeps the desk unlocked opens this page too
  const KEY_AT = 'rd-site-key2', LINK_AT = 'rd-link';
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (u8) => btoa(String.fromCharCode.apply(null, Array.from(u8)));
  const bust = () => '?t=' + Math.floor(Date.now() / 60000);
  let linkSecret = store.get(LINK_AT) || '';
  const m = /[#&]k=([A-Za-z0-9_-]{16,})/.exec(location.hash || '');
  if (m) { linkSecret = m[1]; store.set(LINK_AT, m[1]); try { history.replaceState(null, '', location.pathname); } catch (e) {} }

  async function siteKeyFromPass(pass) {
    const k = await (await fetch('../key.json' + bust(), { cache: 'no-store' })).json();
    if (k.link && !linkSecret) { const e = new Error('Open your personal link to the desk once on this device, then enter the passphrase.'); e.name = 'NeedLink'; throw e; }
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(k.link ? pass + '\n' + linkSecret : pass), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(k.salt), iterations: k.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(k.nonce) }, kek, b64(k.wrapped)));
  }
  async function openFile(name, priv) {
    const res = await fetch(name + bust(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 404 ? 'The paper book has not run yet.' : name + ' did not load (' + res.status + ')');
    const buf = new Uint8Array(await res.arrayBuffer()), n = (buf[0] << 8) | buf[1];
    const fileKey = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, priv, buf.slice(2, 2 + n));
    const key = await crypto.subtle.importKey('raw', fileKey, 'AES-GCM', false, ['decrypt']);
    const zipped = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(2 + n, 14 + n) }, key, buf.slice(14 + n));
    return JSON.parse(await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  }
  async function unlock(raw) {
    const priv = await crypto.subtle.importKey('pkcs8', raw, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['decrypt']);
    render(await openFile('../paper.bin', priv));
  }
  const say = (t, err) => { const el = $('msg'); el.textContent = t; el.className = err ? 'err' : ''; };
  $('lock-form').addEventListener('submit', async (e) => {
    e.preventDefault(); const pass = $('pw').value; if (!pass) return;
    $('go').disabled = true; say('Opening…');
    try { const raw = await siteKeyFromPass(pass); await unlock(raw); if ($('keep').checked) store.set(KEY_AT, toB64(raw)); }
    catch (err) { console.error(err); say(err.name === 'OperationError' ? 'That passphrase does not open it.' : err.message, true); $('go').disabled = false; }
  });
  (async () => {
    const saved = store.get(KEY_AT); if (!saved) return;
    say('Opening…'); $('go').disabled = true;
    try { await unlock(b64(saved)); } catch (err) { console.error(err); say(err.message || 'The saved key no longer fits. Enter the passphrase.', true); $('go').disabled = false; }
  })();

  // ---- the page
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const usd = (v, d = 0) => v == null ? '–' : (v < 0 ? '−$' : '$') + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  const sgn = (v, d = 0) => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: d });
  const pct = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + Number(v).toFixed(d) + '%';
  const cls = (v) => v > 0 ? 'up' : v < 0 ? 'down' : '';
  const prob = (v) => v == null ? '–' : Math.round(v * 100) + '%';
  const when = (t) => t ? new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '–';
  const table = (el, head, rows, empty) => {
    el.innerHTML = rows.length ? '<thead><tr>' + head.map((h) => `<th class="${h[1] || ''}">${h[0]}</th>`).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody>'
      : `<tbody><tr><td class="empty">${empty}</td></tr></tbody>`;
  };
  function upnl(p) { const mk = p.mark != null ? p.mark : p.entry; return p.kind === 'contract' ? (mk - p.entry) * p.qty : (mk - p.entry) * p.qty * p.dir; }

  function render(bundle) {
    $('lock').hidden = true; $('app').hidden = false;
    const F = bundle.files, S = F.paper_summary.json, P = F.paper_positions.json || [], C = (F.paper_closed.json || []).slice().reverse(), E = F.paper_equity.json || [], SC = F.paper_scan.json || [];
    $('built').textContent = 'Updated ' + when(S.built);
    const stat = (label, value, c) => `<div class="stat"><small>${label}</small><b class="${c || ''}">${value}</b></div>`;
    $('stats').innerHTML = stat('Equity', usd(S.equity)) + stat('Profit / loss', sgn(S.pnl) + ' <span style="font-size:13px">' + pct(S.pnl_pct, 2) + '</span>', cls(S.pnl))
      + stat('Cash', usd(S.cash)) + stat('Open', S.open) + stat('In contracts', usd(S.contracts_gross)) + stat('In assets', usd(S.assets_gross))
      + stat('Closed · hit rate', S.closed + (S.hit_rate == null ? '' : ' · ' + S.hit_rate + '%')) + stat('Realised', sgn(S.realized), cls(S.realized));

    // equity curve
    const svg = $('curve');
    if (E.length > 1) {
      const ys = E.map((r) => r[1]), lo = Math.min(S.start_cash, ...ys), hi = Math.max(S.start_cash, ...ys), pad = Math.max((hi - lo) * 0.1, S.start_cash * 0.005);
      const y = (v) => 170 - (v - (lo - pad)) / ((hi + pad) - (lo - pad)) * 160, x = (i) => i / (E.length - 1) * 1000;
      const path = E.map((r, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r[1]).toFixed(1)).join(' ');
      const last = ys[ys.length - 1], col = last >= S.start_cash ? 'var(--up)' : 'var(--down)';
      svg.innerHTML = `<line x1="0" x2="1000" y1="${y(S.start_cash)}" y2="${y(S.start_cash)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="4 6" vector-effect="non-scaling-stroke"/>`
        + `<path d="${path}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      $('curve-note').textContent = `From ${when(E[0][0])} to ${when(E[E.length - 1][0])}, marked every hour. The dashed line is the $${S.start_cash.toLocaleString('en-US')} start.`;
    } else { svg.innerHTML = ''; $('curve-note').textContent = 'The curve starts after the second hourly mark.'; }

    table($('open'), [['Position'], ['Forecast'], ['Size', 'num'], ['Entry', 'num'], ['Mark', 'num'], ['P/L', 'num'], ['Stop / fair', 'num'], ['Opened'], ['Why']],
      P.map((p) => { const u = upnl(p); const isC = p.kind === 'contract';
        return `<tr><td>${esc(p.label)}${isC ? `<br><span class="tag">${esc(p.venue)}</span>` : ''}</td><td class="wrap">${esc(p.claim)}</td>`
          + `<td class="num">${isC ? Math.round(p.qty).toLocaleString('en-US') + ' @' : usd(p.qty * p.entry)}</td><td class="num">${isC ? p.entry.toFixed(3) : p.entry.toPrecision(6)}</td>`
          + `<td class="num">${p.mark == null ? '–' : isC ? p.mark.toFixed(3) : p.mark.toPrecision(6)}</td><td class="num ${cls(u)}">${sgn(u)}</td>`
          + `<td class="num">${isC ? 'fair ' + prob(p.fair) : p.stop.toPrecision(6) + '<br><span class="tag">target ' + p.target.toPrecision(6) + '</span>'}</td>`
          + `<td>${when(p.opened)}</td><td class="wrap">${esc(p.why)}${p.review ? '<br><span style="color:var(--faint)">' + esc(p.review) + '</span>' : ''}</td></tr>`; }),
      'Nothing open. New trades are looked for once a day, after 13:00 UTC.');

    // the scan, trades first
    const kinds = { all: 'All', pass: 'Would trade', contract: 'Contracts', asset: 'Assets' }; let tab = 'pass';
    const drawScan = () => {
      $('scan-tabs').innerHTML = Object.keys(kinds).map((k) => `<button data-k="${k}" class="${k === tab ? 'on' : ''}">${kinds[k]}</button>`).join('');
      const rows = SC.filter((r) => tab === 'all' || (tab === 'pass' ? r.pass : r.type === tab)).sort((a, b) => (b.pass ? 1 : 0) - (a.pass ? 1 : 0));
      table($('scan'), [['Result'], ['Forecast'], ['Instrument'], ['UBIK', 'num'], ['Market', 'num'], ['Edge / R:R', 'num'], ['Why']],
        rows.map((r) => `<tr><td><span class="tag ${r.pass ? 'pass' : ''}">${r.pass ? 'trade' : 'skip'}</span></td><td class="wrap">${esc(r.claim)}</td>`
          + `<td class="wrap">${r.type === 'contract' ? esc(r.side + ' · ' + r.venue + ' · ' + (r.question || r.market)) + ' <span class="tag">' + esc(r.relation) + '</span>' : esc((r.name || r.symbol) + ' · ' + (r.class || ''))}</td>`
          + `<td class="num">${prob(r.ubik)}</td><td class="num">${r.type === 'contract' ? (r.ask == null ? '–' : 'ask ' + r.ask.toFixed(3)) : prob(r.market_prob)}</td>`
          + `<td class="num">${r.type === 'contract' ? (r.edge == null ? '–' : (r.edge * 100).toFixed(1) + ' pts') : (r.rr == null ? '–' : r.rr.toFixed(1))}</td>`
          + `<td class="wrap">${esc(r.why)}${r.review_reason ? '<br><span style="color:var(--faint)">' + esc(r.review_reason) + '</span>' : ''}</td></tr>`),
        tab === 'pass' ? 'Nothing met the rules in the last scan, so the book made no trades.' : 'No candidates.');
      $('scan-tabs').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.k; drawScan(); }));
    };
    drawScan();
    $('scan-note').textContent = (S.traded_on ? 'Last scanned ' + S.traded_on + '. ' : '') + (S.reviewed ? 'Reviewed by Claude.' : 'No Claude review on the last scan, so assets were skipped.');

    table($('closed'), [['Position'], ['Forecast'], ['Opened'], ['Closed'], ['Why closed'], ['P/L', 'num']],
      C.map((p) => `<tr><td>${esc(p.label)}</td><td class="wrap">${esc(p.claim)}</td><td>${when(p.opened)}</td><td>${when(p.closed)}</td><td>${esc(p.why_closed)}</td><td class="num ${cls(p.pnl)}">${sgn(p.pnl)}</td></tr>`),
      'Nothing closed yet.');

    const R = S.rules || {};
    $('foot').textContent = `Paper trading only: no real money. Started ${when(S.started)} with ${usd(S.start_cash)}. Rules: UBIK weighted ${Math.round((R.shrink || 0) * 100)}% against the market, contracts need ${Math.round((R.min_edge || 0) * 100)} points of edge after fees, quarter-Kelly sizing; assets need reward at least ${R.min_rr}× the stop and risk ${((R.risk_per_trade || 0) * 100).toFixed(2)}% of equity. UBIK key: ${S.ubik_key || '–'}. Forecasts are probabilities, not financial advice.`;
  }
})();
</script>
</body>
</html>
